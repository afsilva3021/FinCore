[project]
name = "fincore"
version = "0.1.0"
description = "Sistema modular de gestão financeira e contábil"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncpg>=0.31.0",
    "argon2-cffi>=25.1.0",
    "jinja2>=3.1.6",
    "robyn>=0.72.0",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.1.1",
    "tortoise-orm[asyncpg]>=1.1.9",
    "reportlab>=5.1.0",
]

[project.scripts]
fincore = "fincore.app:main"
fincore-backfill-accounting = "fincore.cli:backfill_accounting_main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]
extend-exclude = ["src/fincore/infrastructure/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.tortoise]
config = "fincore.config.database.TORTOISE_ORM"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

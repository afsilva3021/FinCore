openapi: 3.1.0
info:
  title: FinCore API
  version: "1.0"
  description: |
    API JSON do FinCore. Autenticação por cookie de sessão (faça login em /login);
    toda requisição de escrita exige o header `X-CSRF-Token` com o token de
    `GET /api/v1/session`. Valores monetários são strings decimais com ponto ("250.00").
    Perfil `viewer` recebe 403 em qualquer escrita; produtos e estoque exigem perfil `owner` ou
    `stock`, e as demais escritas, `owner` ou `finance`.
servers:
  - url: http://127.0.0.1:8080
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fincore_session
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    TitleId:
      name: title_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StockMovementId:
      name: movement_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TransactionId:
      name: transaction_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      examples: ["250.00"]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, examples: [invalid_title]}
            message: {type: string}
    Quantity:
      type: string
      pattern: '^\d+(\.\d{1,4})?$'
      examples: ["2.5000"]
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        sku: {type: string, examples: [CAM-001]}
        name: {type: string}
        description: {type: [string, "null"]}
        barcode: {type: [string, "null"], description: GTIN-8/12/13/14}
        ncm: {type: [string, "null"], description: Referência informada; não é conferida na tabela oficial.}
        unit:
          type: object
          properties:
            id: {type: string, format: uuid}
            code: {type: string, examples: [UN]}
        group:
          type: [object, "null"]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        sale_price: {$ref: '#/components/schemas/Money'}
        currency: {type: string, examples: [BRL]}
        min_stock: {$ref: '#/components/schemas/Quantity'}
        tracks_stock: {type: boolean}
        is_active: {type: boolean}
    ProductCreate:
      type: object
      required: [sku, name, unit_id]
      properties:
        sku: {type: string, maxLength: 40, description: "Letras, números e . _ / -; gravado em maiúsculas."}
        name: {type: string, maxLength: 160}
        unit_id: {type: string, format: uuid}
        group_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 2000}
        barcode: {type: [string, "null"]}
        ncm: {type: [string, "null"]}
        sale_price: {$ref: '#/components/schemas/Money'}
        min_stock: {$ref: '#/components/schemas/Quantity'}
        tracks_stock: {type: boolean, default: true}
    StockBalance:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        sku: {type: string}
        product_name: {type: string}
        unit: {type: string, examples: [UN]}
        warehouse_id: {type: string, format: uuid}
        warehouse_code: {type: string}
        quantity: {$ref: '#/components/schemas/Quantity'}
        average_cost: {type: string, description: Custo médio unitário com 6 casas., examples: ["6.000000"]}
        total_value: {$ref: '#/components/schemas/Money'}
    StockMovement:
      type: object
      description: Movimento de estoque efetivado; imutável.
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid}
        sequence: {type: integer, description: Ordem do movimento na posição (produto + depósito).}
        direction: {type: string, enum: [in, out]}
        reason: {type: string, enum: [opening, adjustment, transfer, reversal, purchase, sale]}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit_cost: {type: string, examples: ["6.000000"]}
        total_cost: {$ref: '#/components/schemas/Money'}
        balance_quantity: {$ref: '#/components/schemas/Quantity'}
        balance_value: {$ref: '#/components/schemas/Money'}
        occurred_on: {type: string, format: date}
        notes: {type: [string, "null"]}
        transfer_id: {type: [string, "null"], format: uuid}
        reversal_of_id: {type: [string, "null"], format: uuid}
        journal_entry_id: {type: [string, "null"], format: uuid}
    StockMovementCreate:
      type: object
      required: [type, operation_key, product_id, warehouse_id, quantity, occurred_on]
      properties:
        type:
          type: string
          enum: [opening, entry, exit, transfer]
          description: Saldo inicial, ajuste de entrada, ajuste de saída ou transferência.
        operation_key: {type: string, format: uuid, description: Chave de idempotência.}
        product_id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid, description: Depósito (de origem, na transferência).}
        destination_warehouse_id: {type: string, format: uuid, description: Obrigatório na transferência.}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit_cost: {$ref: '#/components/schemas/Quantity', description: Só para opening e entry; saídas usam o custo médio.}
        occurred_on: {type: string, format: date, description: Não pode estar no futuro.}
        notes: {type: string, maxLength: 240}
    StockMovementList:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StockMovement'}}
    PurchaseOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: string, examples: [PC-00001]}
        status: {type: string, enum: [draft, approved, partially_received, received, cancelled]}
        supplier:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        warehouse_id: {type: string, format: uuid}
        order_date: {type: string, format: date}
        expected_date: {type: [string, "null"], format: date}
        payment_method: {type: string}
        installment_count: {type: integer}
        first_due_days: {type: integer}
        total: {$ref: '#/components/schemas/Money'}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              product_id: {type: string, format: uuid}
              sku: {type: string}
              quantity: {$ref: '#/components/schemas/Quantity'}
              unit_cost: {type: string, examples: ["4.000000"]}
              received_quantity: {$ref: '#/components/schemas/Quantity'}
    SalesOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        number: {type: string, examples: [PV-00001]}
        status: {type: string, enum: [quote, confirmed, invoiced, cancelled]}
        customer:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        warehouse_id: {type: string, format: uuid}
        order_date: {type: string, format: date}
        valid_until: {type: [string, "null"], format: date}
        payment_method: {type: string}
        installment_count: {type: integer}
        first_due_days: {type: integer}
        total: {$ref: '#/components/schemas/Money'}
        items:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              product_id: {type: string, format: uuid}
              sku: {type: string}
              quantity: {$ref: '#/components/schemas/Quantity'}
              unit_price: {$ref: '#/components/schemas/Money'}
              discount: {$ref: '#/components/schemas/Money'}
              total: {$ref: '#/components/schemas/Money'}
    Title:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [payable, receivable]}
        description: {type: string}
        status: {type: string, enum: [open, partial, settled, cancelled]}
        overdue: {type: boolean, description: Calculado a partir do vencimento e da situação.}
        original_amount: {$ref: '#/components/schemas/Money'}
        open_balance: {$ref: '#/components/schemas/Money'}
        currency: {type: string, examples: [BRL]}
        issue_date: {type: string, format: date}
        due_date: {type: string, format: date}
        payment_method: {type: string}
        installment_number: {type: integer}
        installment_count: {type: integer}
        installment_group: {type: [string, "null"], format: uuid}
        counterparty_id: {type: [string, "null"], format: uuid}
        account_id: {type: string, format: uuid}
        category_id: {type: [string, "null"], format: uuid}
        document_number: {type: [string, "null"]}
    TitleCreate:
      type: object
      required: [operation_key, type, description, counterparty_name, account_id, amount,
                 issue_date, due_date, payment_method]
      properties:
        operation_key: {type: string, format: uuid, description: Reenvio com a mesma chave devolve os títulos já criados.}
        type: {type: string, enum: [payable, receivable]}
        description: {type: string, maxLength: 240}
        counterparty_name: {type: string}
        account_id: {type: string, format: uuid}
        category_id: {type: string, format: uuid}
        amount: {$ref: '#/components/schemas/Money'}
        installments: {type: integer, minimum: 1, maximum: 36, default: 1}
        issue_date: {type: string, format: date}
        due_date: {type: string, format: date, description: Vencimento da 1ª parcela; as demais são mensais.}
        payment_method: {type: string, enum: [cash, bank_transfer, pix, boleto, card, other]}
        document_number: {type: string}
        notes: {type: string}
    SettlementCreate:
      type: object
      required: [operation_key, amount_applied, paid_on, account_id, payment_method]
      properties:
        operation_key: {type: string, format: uuid}
        amount_applied: {$ref: '#/components/schemas/Money'}
        paid_on: {type: string, format: date}
        account_id: {type: string, format: uuid}
        payment_method: {type: string, enum: [cash, bank_transfer, pix, boleto, card, other]}
        discount: {$ref: '#/components/schemas/Money'}
        interest: {$ref: '#/components/schemas/Money'}
        fine: {$ref: '#/components/schemas/Money'}
        fees: {$ref: '#/components/schemas/Money'}
        proof_reference: {type: string}
        notes: {type: string}
    Settlement:
      type: object
      properties:
        id: {type: string, format: uuid}
        operation_key: {type: string, format: uuid}
        paid_on: {type: string, format: date}
        amount_applied: {$ref: '#/components/schemas/Money'}
        discount: {$ref: '#/components/schemas/Money'}
        interest: {$ref: '#/components/schemas/Money'}
        fine: {$ref: '#/components/schemas/Money'}
        fees: {$ref: '#/components/schemas/Money'}
        net_amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: "aplicado − desconto + juros + multa ± tarifas (soma em títulos a pagar, subtrai em títulos a receber)"
        payment_method: {type: string}
        account_id: {type: string, format: uuid}
        financial_transaction_id: {type: string, format: uuid}
  responses:
    Unauthenticated:
      description: Sessão ausente ou expirada.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: CSRF inválido ou perfil sem permissão de escrita nesta área.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Registro inexistente ou de outra organização.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Invalid:
      description: Dados inválidos ou regra de negócio violada (a mensagem diz qual).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Conflict:
      description: Chave de operação reaproveitada ou transição de estado não permitida.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
paths:
  /api/v1/health:
    get:
      summary: Saúde da API
      security: []
      responses:
        "200": {description: OK}
  /api/v1/session:
    get:
      summary: Token CSRF para as escritas
      responses:
        "200":
          description: Token e cookie CSRF assinados.
          content:
            application/json:
              schema: {type: object, properties: {csrf_token: {type: string}}}
        "401": {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/products:
    get:
      summary: Lista produtos
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: q, in: query, description: "Código, descrição ou código de barras.", schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [all, active, inactive], default: all}}
      responses:
        "200":
          description: Página de produtos da organização.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Product'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
    post:
      summary: Cadastra produto
      description: SKU e código de barras são únicos por organização. Não cria estoque.
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProductCreate'}}}
      responses:
        "201":
          description: Produto criado.
          content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409":
          description: Já existe produto com este SKU ou código de barras.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  /api/v1/products/{product_id}:
    get:
      summary: Detalha um produto
      parameters:
        - {$ref: '#/components/parameters/ProductId'}
      responses:
        "200":
          description: Produto.
          content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "404": {$ref: '#/components/responses/NotFound'}
  /api/v1/stock/balances:
    get:
      summary: Posição de estoque por produto e depósito
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: q, in: query, schema: {type: string}}
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: warehouse_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Posições que já tiveram movimento, com custo médio e valor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/StockBalance'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/stock/movements:
    get:
      summary: Histórico de movimentos de estoque
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: product_id, in: query, schema: {type: string, format: uuid}}
        - {name: warehouse_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Movimentos, do mais recente para o mais antigo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/StockMovement'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
    post:
      summary: Registra entrada, saída ou transferência
      description: |
        Grava o movimento, atualiza a posição e lança no diário numa única transação.
        Saída ou transferência maior que o saldo é recusada. Transferência devolve dois
        movimentos (saída da origem e entrada no destino).
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/StockMovementCreate'}}}
      responses:
        "200":
          description: Reenvio com a mesma operation_key; devolve os movimentos já gravados.
          content: {application/json: {schema: {$ref: '#/components/schemas/StockMovementList'}}}
        "201":
          description: Movimentos criados.
          content: {application/json: {schema: {$ref: '#/components/schemas/StockMovementList'}}}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
  /api/v1/stock/movements/{movement_id}/reverse:
    post:
      summary: Estorna um movimento de estoque
      description: |
        Cria o movimento oposto e preserva o original. Só o último movimento da posição
        pode ser estornado; uma transferência é desfeita nas duas pernas.
      security: [{session: [], csrf: []}]
      parameters:
        - {$ref: '#/components/parameters/StockMovementId'}
      responses:
        "201":
          description: Movimentos de estorno criados.
          content: {application/json: {schema: {$ref: '#/components/schemas/StockMovementList'}}}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
  /api/v1/purchase-orders:
    get:
      summary: Lista pedidos de compra
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: status, in: query, schema: {type: string, enum: [draft, approved, partially_received, received, cancelled]}}
      responses:
        "200":
          description: Pedidos do mais novo para o mais antigo, com itens e total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PurchaseOrder'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/purchase-orders/{order_id}:
    get:
      summary: Detalha um pedido de compra
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Pedido com itens.
          content: {application/json: {schema: {$ref: '#/components/schemas/PurchaseOrder'}}}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "404": {$ref: '#/components/responses/NotFound'}
  /api/v1/sales-orders:
    get:
      summary: Lista orçamentos e pedidos de venda
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: status, in: query, schema: {type: string, enum: [quote, confirmed, invoiced, cancelled]}}
      responses:
        "200":
          description: Pedidos do mais novo para o mais antigo, com itens e total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SalesOrder'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
  /api/v1/sales-orders/{order_id}:
    get:
      summary: Detalha um orçamento ou pedido de venda
      parameters:
        - {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Pedido com itens.
          content: {application/json: {schema: {$ref: '#/components/schemas/SalesOrder'}}}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "404": {$ref: '#/components/responses/NotFound'}
  /api/v1/titles:
    get:
      summary: Lista títulos a pagar/receber
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
        - {name: type, in: query, schema: {type: string, enum: [payable, receivable]}}
        - {name: status, in: query, schema: {type: string, enum: [open, partial, settled, cancelled]}}
      responses:
        "200":
          description: Página de títulos com saldo em aberto derivado das baixas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Title'}}
                  limit: {type: integer}
                  offset: {type: integer}
                  total: {type: integer}
        "401": {$ref: '#/components/responses/Unauthenticated'}
    post:
      summary: Cadastra título (à vista ou parcelado)
      description: Não movimenta caixa nem aparece no extrato. Parcelas somam exatamente o total.
      security: [{session: [], csrf: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TitleCreate'}}}
      responses:
        "201":
          description: Títulos criados (ou os mesmos, num reenvio com a mesma operation_key).
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Title'}}}}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "409": {$ref: '#/components/responses/Conflict'}
  /api/v1/titles/{title_id}:
    get:
      summary: Detalhe do título com as baixas
      parameters: [{$ref: '#/components/parameters/TitleId'}]
      responses:
        "200":
          description: Título e baixas.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Title'}
                  - type: object
                    properties:
                      settlements: {type: array, items: {$ref: '#/components/schemas/Settlement'}}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "404": {$ref: '#/components/responses/NotFound'}
  /api/v1/titles/{title_id}/settlements:
    post:
      summary: Registra baixa (total ou parcial)
      description: Cria a transação liquidada e o lançamento contábil vinculados, de forma atômica.
      security: [{session: [], csrf: []}]
      parameters: [{$ref: '#/components/parameters/TitleId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SettlementCreate'}}}
      responses:
        "201":
          description: Baixa registrada (ou a mesma, num reenvio com a mesma operation_key).
          content: {application/json: {schema: {$ref: '#/components/schemas/Settlement'}}}
        "400": {$ref: '#/components/responses/Invalid'}
        "401": {$ref: '#/components/responses/Unauthenticated'}
        "403": {$ref: '#/components/responses/Forbidden'}
        "404": {$ref: '#/components/responses/NotFound'}
        "409": {$ref: '#/components/responses/Conflict'}
  /api/v1/titles/{title_id}/cancel:
    post:
      summary: Cancela título em aberto sem baixas
      security: [{session: [], csrf: []}]

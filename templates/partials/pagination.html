{% if pagination and (pagination.has_previous or pagination.has_next) %}
<nav class="d-flex justify-content-between align-items-center mt-3 pagination-nav" aria-label="Paginação">
  {% if pagination.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="{{ pagination.url(pagination.number - 1) }}" rel="prev">← Mais recentes</a>{% else %}<span></span>{% endif %}
  <span class="text-secondary small">Página {{ pagination.number }}</span>
  {% if pagination.has_next %}<a class="btn btn-sm btn-outline-secondary" href="{{ pagination.url(pagination.number + 1) }}" rel="next">Mais antigos →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}

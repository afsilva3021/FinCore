<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>{% block title %}FinCore{% endblock %}</title>
  <script src="/static/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body class="app-body {% block body_class %}{% endblock %}{% if current_role() and not can_write() %} is-readonly{% endif %}">
  {% block content %}{% endblock %}
  <div class="modal fade fincore-confirm-modal" id="fincoreConfirmModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="fincoreConfirmTitle" aria-describedby="fincoreConfirmMessage" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <span class="confirm-modal-icon" data-confirm-icon aria-hidden="true">?</span>
          <div class="confirm-modal-heading"><h2 class="modal-title" id="fincoreConfirmTitle">Confirmar ação</h2><span>FinCore</span></div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="fincoreConfirmMessage"></div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal" data-confirm-cancel>Cancelar</button><button type="button" class="btn btn-primary" data-confirm-accept>Confirmar</button></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
